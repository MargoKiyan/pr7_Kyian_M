<!DOCTYPE html>
<html lang="uk">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style.css">
  <title>Список справ - Киян М. ПД-21</title>
</head>

<body>
  <div class="container">
    <h1>Список справ</h1>

    <div class="counter-panel">
      <span>Усього справ: <span id="item-count">0</span></span>
      <span>Незроблених: <span id="unchecked-count">0</span></span>
    </div>

    <button id="add-todo-button" class="add-button" type="button">Нова справа</button>

    <ul id="todo-list" class="todo-list"></ul>
  </div>

  <script src="script.js"></script>
</body>

</html>
